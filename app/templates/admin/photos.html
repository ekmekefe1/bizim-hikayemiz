{% extends "admin/base.html" %}
{% block page_title %}Fotoğraflar{% endblock %}
{% block content %}
<form method="POST" class="admin-form" enctype="multipart/form-data">
    <div class="form-row">
        <div class="form-group">
            <label for="photo">Fotoğraf Seç</label>
            <input type="file" name="photo" id="photo" class="form-input" accept="image/*" required>
        </div>
        <div class="form-group">
            <label for="caption">Açıklama (isteğe bağlı)</label>
            <input type="text" name="caption" id="caption" class="form-input" placeholder="Fotoğraf açıklaması...">
        </div>
    </div>
    <button type="submit" class="btn btn-primary">Yükle</button>
</form>

<div class="photo-grid">
    {% for photo in photos %}
    <div class="photo-item">
        <img src="{{ url_for('static', filename='uploads/photos/' + photo.filename) }}" alt="{{ photo.caption or photo.filename }}">
        <div class="photo-info">
            <span class="photo-caption">{{ photo.caption or 'Açıklama yok' }}</span>
            <form method="POST" action="{{ url_for('admin.photo_delete', id=photo.id) }}">
                <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('Silmek istediğinize emin misiniz?')">Sil</button>
            </form>
        </div>
    </div>
    {% else %}
    <div class="empty-state">
        <span class="empty-icon">📸</span>
        <p>Henüz fotoğraf yüklenmemiş.</p>
        <p class="empty-hint">Fotoğrafları yüklemek için yukarıdaki formu kullanın.</p>
    </div>
    {% endfor %}
</div>
{% endblock %}
