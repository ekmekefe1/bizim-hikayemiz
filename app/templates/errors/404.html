<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sayfa Bulunamadı - Bizim Hikayemiz</title>
    <style>
        body { font-family: 'Inter', sans-serif; background: #060612; color: #f0f0f0; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; text-align: center; padding: 20px; }
        .error-card { max-width: 400px; }
        .error-code { font-size: 5rem; font-family: 'Playfair Display', serif; color: #e94560; margin-bottom: 8px; }
        .error-title { font-size: 1.5rem; margin-bottom: 12px; color: #fff; }
        .error-text { color: rgba(255,255,255,0.4); margin-bottom: 24px; }
        a { color: #e94560; text-decoration: none; padding: 10px 24px; border: 1px solid rgba(233,69,96,0.3); border-radius: 8px; display: inline-block; }
        a:hover { background: rgba(233,69,96,0.1); }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-code">404</div>
        <div class="error-title">Sayfa Bulunamadı</div>
        <div class="error-text">Aradığınız sayfa mevcut değil.</div>
        <a href="/">Ana Sayfaya Dön</a>
    </div>
</body>
</html>
